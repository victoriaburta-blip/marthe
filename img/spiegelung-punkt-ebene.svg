    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CD4F39"/>
    </marker>
    <marker id="tiny" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#fff" stroke-width="2"/>
    </marker>
  </defs>
  <polygon points="15,140 190,170 285,115 110,85" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.8" stroke-linejoin="round"/>
  <line x1="150" y1="12" x2="150" y2="224" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5" stroke-opacity="0.85"/>
  <line x1="150" y1="35" x2="150" y2="121" stroke="#CD4F39" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="150" y1="125" x2="150" y2="211" stroke="#CD4F39" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M150 113 L161.8 115 L161.8 127" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <circle cx="155.9" cy="120" r="1.6" fill="#ffffff"/>
  <circle cx="150" cy="35" r="4.5" fill="#ffffff"/>
  <circle cx="150" cy="125" r="4.5" fill="#ffffff"/>
  <circle cx="150" cy="215" r="4.5" fill="#ffffff"/>
  <text x="126" y="42" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#ffffff">P</text>
  <text x="126" y="130" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#ffffff">D</text>
  <text x="120" y="222" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#ffffff">P′</text>
  <text x="45" y="142" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#ffffff">E</text>
  <text x="160" y="88" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#ffffff">PD</text>
  <line x1="160" y1="71" x2="188" y2="71" stroke="#ffffff" stroke-width="1.6" marker-end="url(#tiny)"/>
  <text x="160" y="178" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#ffffff">PD</text>
  <line x1="160" y1="161" x2="188" y2="161" stroke="#ffffff" stroke-width="1.6" marker-end="url(#tiny)"/>
</svg>
